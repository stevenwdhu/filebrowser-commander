# FileBrowser Commander's image: tests main, then builds upstream's _docker/Dockerfile and pushes it
# to ghcr.io/<owner>/<repo>. It's the fork's own file, so rebasing on upstream never touches it;
# upstream's workflows stay in the tree but are turned off in the repo's Actions settings.
name: commander image

on:
  push:
    branches:
      - "main"
    # No Markdown file goes into the image, so a docs-only push would only republish the same app
    # under a new sha- tag
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commander-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Upstream's login timing test compares 5 millisecond-long samples per user, too few for a
      # shared runner's noise; it passes on a quiet machine
      - working-directory: backend
        run: go test ./... -skip '^TestJSONAuth_NoTimingAttack$'

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Upstream's image lets an admin opt in to usage reports sent to upstream's server; this one
      # is built without them
      - name: Build without upstream's analytics
        run: |
          sed -i 's/-tags analytics,/-tags /' _docker/Dockerfile
          if grep -n analytics _docker/Dockerfile; then
            echo "::error::_docker/Dockerfile still has the analytics build tag; update this step"
            exit 1
          fi
      # The version the app shows; it matches no upstream release, so the update check stays quiet
      - id: version
        run: echo "version=commander-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=FileBrowser Commander
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./_docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
